name: Lint & Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint and format checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black ruff isort

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Check gofmt
        run: |
          set -e
          if [ -n "$(gofmt -l .)" ]; then echo "gofmt found files that require formatting" && gofmt -l . && exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Run Go tests
        run: |
          cd controlplane
          go test ./... -count=1
