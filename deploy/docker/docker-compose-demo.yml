# ─────────────────────────────────────────────────────────────────────────────
# Omega-LB demo stack — Python proxy + 4 backends + Streamlit dashboard
# No Linux kernel, no eBPF, no privileges required.
#
# Usage:
#   docker compose -f deploy/docker/docker-compose-demo.yml up
#
# Then open:
#   Proxy:     http://localhost:8080
#   Dashboard: http://localhost:8501
#   Status:    http://localhost:8080/_omega/status
# ─────────────────────────────────────────────────────────────────────────────

services:
  # Real aiohttp backends (all 4 personalities in one service)
  backends:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    command: ["python", "-m", "demo.backends"]
    environment:
      - OMEGA_BACKEND_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; [u.urlopen(f'http://127.0.0.1:{p}/_health', timeout=2).read() for p in (9000,9001,9002,9003)]"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks: [demo]

  # Omega-LB Python proxy
  proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    command: ["python", "-m", "demo.proxy"]
    ports:
      - "8080:8080"
    environment:
      - OMEGA_CONFIG=/app/omega-lb-docker.yaml
      - OMEGA_ADMIN_TOKEN=local-dev-token
    volumes:
      - metrics:/app/demo
    depends_on:
      backends:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/_omega/status', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks: [demo]
    restart: unless-stopped

  # Load generator
  loadgen:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    command: ["python", "-m", "demo.loadgen"]
    environment:
      - OMEGA_PROXY_URL=http://proxy:8080
    depends_on:
      proxy:
        condition: service_healthy
    networks: [demo]
    restart: unless-stopped

  # Streamlit dashboard
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    command: ["python", "-m", "streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - metrics:/app/demo
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501', timeout=3).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 8s
    networks: [demo]
    restart: unless-stopped

volumes:
  metrics:

networks:
  demo:
    driver: bridge
