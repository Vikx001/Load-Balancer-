name: Bug Report
description: Something is broken or not working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, check if an existing issue covers this.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact numbered steps to trigger the bug
      placeholder: |
        1. Start the stack with `./start.sh`
        2. Send request to port 8080
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include full error message and stack trace.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in your environment details
      value: |
        - OS:
        - Python version:
        - Go version (if control plane):
        - Kernel version (if eBPF):
        - Omega-LB version/commit:
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Logs, screenshots, config snippets — anything relevant
