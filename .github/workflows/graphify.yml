name: Graphify AST Regeneration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/graphify/**'
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

permissions:
  contents: write

jobs:
  graphify:
    name: Run Graphify (AST-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Graphify
        run: |
          python -m venv .venv-graphify
          . .venv-graphify/bin/activate
          pip install --upgrade pip
          pip install graphifyy

      - name: Run Graphify update (AST-only)
        run: |
          . .venv-graphify/bin/activate
          # --no-viz and --out are not valid for `update`; only --no-cluster is supported
          graphify update . --no-cluster

      - name: Move outputs to docs/graphify
        run: |
          if [ ! -d graphify-out ]; then
            echo "graphify-out not found – Graphify extraction produced no output, skipping"
            exit 1
          fi
          rm -rf docs/graphify
          mkdir -p docs/graphify
          rsync -a graphify-out/ docs/graphify/

      - name: Commit and push graph outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/graphify
          git commit -m "chore(graph): update AST-only graph outputs [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
