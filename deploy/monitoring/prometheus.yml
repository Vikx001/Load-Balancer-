global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/omegalb-monitoring/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: omegalb-dashboard
    static_configs:
      - targets: ['dashboard:8001']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
