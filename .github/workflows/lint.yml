name: Lint & Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint and format checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'controlplane/go.mod'

      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black ruff isort

      - name: Format Go files
        working-directory: controlplane
        run: gofmt -w $(find . -name '*.go')

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Check gofmt
        run: |
          set -e
          FILES=$(gofmt -l ./controlplane)
          if [ -n "$FILES" ]; then
            echo "gofmt found files that require formatting:"
            echo "$FILES"
            exit 1
          fi

      - name: go vet
        working-directory: controlplane
        run: go vet ./...

      - name: Run Go tests
        working-directory: controlplane
        run: go test ./... -count=1
