[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # long lines are fine in a dashboard

[tool.ruff.lint.per-file-ignores]
# dashboard uses intentionally compact semicolon style for simulation code
# F541: f-strings without placeholders are intentional (HTML template strings)
"dashboard/app.py" = ["E701", "E702", "F541"]
# demo/ is compact simulation/research code — not production style
"demo/**" = ["E401", "E701", "E702", "F401", "F841"]
# ml/ is compact research training code — not production style
"ml/**" = ["E401", "E702", "F401", "F841"]
# tests use compact helpers; some imports are conditionally used
"tests/**" = ["E401", "E702", "F401", "F841"]

[tool.pytest.ini_options]
# Discover all test_*.py files under tests/
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that start real subprocesses (deselect with -m 'not integration')",
    "slow: marks tests that take >10s to run",
]

[tool.coverage.run]
branch = true
source = ["demo", "ml"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60   # raise this as coverage grows
